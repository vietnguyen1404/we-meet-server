name: Deploy WeMeet BE

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            echo "Pulling latest code..."
            cd /home/ubuntu/we-meet-server
            git pull origin develop

            echo "Setup Node..."
            export NVM_DIR="$HOME/.nvm"
            source $NVM_DIR/nvm.sh
            nvm use 22.19

            echo "Installing dependencies..."
            export NODE_ENV=production
            HUSKY=0 npm ci --omit=dev --ignore-scripts

            echo "Syncing checksum for patched migration 0..."
            npm run db:migrate:resolve:m0 || true

            echo "Applying database migrations..."
            npm run db:migrate:deploy

            echo "Generating Prisma client..."
            npm run db:generate

            echo "Building application..."
            npm run build

            echo "Restarting application..."
            pm2 reload nest-app --update-env 2>/dev/null || pm2 start dist/src/main.js --name nest-app
            pm2 save

            echo "Deploy success"
